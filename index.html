<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gaskiya Medical Diagnostics and Research Laboratory</title>
<style>
:root{--bg:#EEF7F2;--card:#FFFFFF;--ink:#0E3B2D;--muted:#4F6B60;--line:#CFE6DA;--brand:#0E4D3A;--brand2:#1F7A5A;--accent:#C93A32;--onbrand:#FFFFFF;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1A15;--card:#12261E;--ink:#E3F3EA;--muted:#9DBBAC;--line:#24463A;--brand:#1F7A5A;--brand2:#2E9C75;--accent:#E8645C}}
:root[data-theme="dark"]{--bg:#0B1A15;--card:#12261E;--ink:#E3F3EA;--muted:#9DBBAC;--line:#24463A;--brand:#1F7A5A;--brand2:#2E9C75;--accent:#E8645C}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.app{display:flex;min-height:100vh}
nav{width:220px;background:var(--brand);color:var(--onbrand);padding:18px 12px;display:flex;flex-direction:column;gap:6px;flex-shrink:0}
nav .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;line-height:1.1;padding:0 6px 14px}
nav button{all:unset;cursor:pointer;padding:10px 12px;border-radius:8px;font-weight:600;color:var(--onbrand)}
nav button:hover,nav button.on{background:rgba(255,255,255,.18)}
main{flex:1;padding:24px;min-width:0}
h1{font-size:24px;margin:0 0 16px}h2{font-size:17px;margin:20px 0 8px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.stat b{display:block;font-size:30px;line-height:1.1}.stat span{color:var(--muted);font-size:13px}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;background:var(--card)}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:middle}
th{background:var(--brand);color:var(--onbrand);font-size:13px}
tr[data-open]{cursor:pointer}tr[data-open]:hover td{background:rgba(31,122,90,.1)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px;width:100%}
td input{border-color:transparent;padding:6px}
label{font-size:13px;font-weight:600;color:var(--muted);display:block;margin-bottom:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.btn{cursor:pointer;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:700;background:var(--brand);color:var(--onbrand);margin:12px 8px 0 0}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid var(--line)}
.chip.done{background:var(--brand2);color:#FFFFFF;border-color:var(--brand2)}
.tests{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 14px}
.tests label{font-weight:500;color:var(--ink);display:flex;gap:8px;align-items:center;margin:0}.tests input{width:auto}
.muted{color:var(--muted)}
.hero{display:flex;align-items:center;gap:18px;background:var(--brand);color:#FFFFFF;border-radius:12px;margin-bottom:20px;overflow:hidden;padding-left:18px;min-height:132px}
.hl{height:112px;width:auto;flex-shrink:0}
.h5{font-size:13px;font-weight:700;margin-top:6px}
.ht{flex:1;min-width:0;padding:10px 0}
.h1{font-size:30px;font-weight:800;line-height:1.05}
.h2{font-size:16px;font-weight:700;line-height:1.25}
.h4{font-size:12px;margin-top:6px}
.hp{align-self:stretch;width:210px;object-fit:cover;-webkit-mask-image:linear-gradient(to right,transparent,#000 40%);mask-image:linear-gradient(to right,transparent,#000 40%)}
#rep{display:none}
@media (max-width:760px){.app{flex-direction:column}nav{width:100%;flex-direction:row;overflow-x:auto;align-items:center}nav .logo{padding:0 8px 0 0;white-space:nowrap}main{padding:16px}.hp{display:none}.h1{font-size:22px}.hl{height:72px;width:auto}}
@media print{.app{display:none!important}#rep{display:block!important;color:#000;background:#FFFFFF}#rep th{background:#0E4D3A!important;color:#FFFFFF!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}#rep td,#rep th{border-color:#888}}
</style>
</head>
<body>
<div class="app">
<nav id="nav"></nav>
<main id="main"></main>
</div>
<div id="rep"></div>

const NAV=[["dash","Dashboard"],["patients","Patients"],["new","New Test Order"],["orders","Orders & Results"],["admin","Admin"]];

function chip(o){return '<span class="chip '+(o.status==="completed"?"done":"")+'">'+(o.status==="completed"?"Completed":"Pending")+"</span>"}
function rows(list){
 if(!list.length)return '<tr><td colspan="6" class="muted">Nothing here yet.</td></tr>';
 return list.map(o=>'<tr data-open="'+o.id+'"><td>'+esc(o.labNo)+"</td><td>"+esc(pat(o.pid).name)+"</td><td>"+esc(o.date)+"</td><td>"+o.tests.length+"</td><td>"+money(o.amount)+"</td><td>"+chip(o)+"</td></tr>").join("");
}
const head='<tr><th>Lab No.</th><th>Patient</th><th>Date</th><th>Tests</th><th>Amount</th><th>Status</th></tr>';
function ordersTable(list){return '<div class="wrap"><table>'+head+rows(list)+"</table></div>"}

function vDash(){
 const o=db.orders,td=o.filter(x=>x.date===today()).length,pend=o.filter(x=>x.status!=="completed").length;
 const owed=o.reduce((s,x)=>s+Math.max(0,(+x.amount||0)-(+x.paid||0)),0);
 return "<h1>Dashboard</h1>"+'<div class="cards">'+[["Patients",db.patients.length],["Orders today",td],["Pending results",pend],["Outstanding",money(owed)]].map(a=>'<div class="card stat"><b>'+a[1]+"</b><span>"+a[0]+"</span></div>").join("")+"</div><h2>Recent orders</h2>"+ordersTable(o.slice().reverse().slice(0,8));
}
function vPatients(){
 return "<h1>Patients</h1>"+'<div class="card"><div class="grid"><div><label for="pn">Full name</label><input id="pn"></div><div><label for="pa">Age</label><input id="pa"></div><div><label for="ps">Sex</label><select id="ps"><option>Female</option><option>Male</option></select></div><div><label for="pp">Phone</label><input id="pp"></div><div><label for="pd">Address</label><input id="pd"></div></div><button class="btn" data-act="addPatient">Add patient</button></div>'+
 '<h2>Patient list</h2><input id="q" placeholder="Search by name or phone" aria-label="Search patients"><div class="wrap" style="margin-top:10px"><table id="pt"><tr><th>Name</th><th>Age / Sex</th><th>Phone</th><th>Address</th></tr>'+
 (db.patients.length?db.patients.map(p=>"<tr><td>"+esc(p.name)+"</td><td>"+esc(p.age)+" / "+esc(p.sex)+"</td><td>"+esc(p.phone)+"</td><td>"+esc(p.address)+"</td></tr>").join(""):'<tr><td colspan="4" class="muted">No patients yet.</td></tr>')+"</table></div>";
}
function vNew(){
 if(!db.patients.length)return '<h1>New Test Order</h1><div class="card">Add a patient first. <button class="btn" data-nav="patients">Go to Patients</button></div>';
 const t=Object.keys(db.catalog).map(s=>"<h2>"+esc(s)+'</h2><div class="tests">'+db.catalog[s].map(n=>'<label><input type="checkbox" class="tk" value="'+esc(s+"|"+n.name)+'">'+esc(n.name)+"</label>").join("")+"</div>").join("");
 return '<h1>New Test Order</h1><div class="card"><div class="grid"><div><label for="op">Patient</label><select id="op">'+db.patients.map(p=>'<option value="'+p.id+'">'+esc(p.name)+"</option>").join("")+'</select></div><div><label for="oc">Referring clinician</label><input id="oc"></div><div><label for="osp">Specimen(s)</label><input id="osp" placeholder="e.g. Blood, urine"></div><div><label for="oa">Amount charged (\u20A6)</label><input id="oa" type="number" min="0"></div><div><label for="opd">Amount paid (\u20A6)</label><input id="opd" type="number" min="0"></div></div>'+t+'<button class="btn" data-act="saveOrder">Create order</button></div>';
}
function vAdmin(){
 const lock=m=>'<h1>Admin</h1><div class="card"><p>'+m+'</p><div style="max-width:240px"><label for="ap">PIN</label><input id="ap" type="password" autocomplete="off"></div>';
 if(!db.pin)return lock("Set an admin PIN (at least 4 characters) to manage the test catalog.")+'<button class="btn" data-act="setPin">Set PIN</button></div>';
 if(!ui.admin)return lock("Enter the admin PIN.")+'<button class="btn" data-act="unlock">Unlock</button></div>';
 const secs=Object.keys(db.catalog);
 return '<h1>Admin: Test Catalog</h1><div class="card"><h2 style="margin-top:0">Add a new test</h2><div class="grid"><div><label for="sel">Section</label><select id="sel">'+secs.map(s=>"<option>"+esc(s)+"</option>").join("")+'</select></div><div><label for="ns">Or a new section name</label><input id="ns"></div><div><label for="nt">Test name</label><input id="nt"></div><div><label for="nu">Default unit (optional)</label><input id="nu"></div><div><label for="nr">Default reference range (optional)</label><input id="nr"></div></div><button class="btn" data-act="addTest">Add test</button><button class="btn alt" data-act="lock">Lock admin</button></div>'+
 secs.map(s=>"<h2>"+esc(s)+'</h2><div class="wrap"><table><tr><th>Test name</th><th>Default unit</th><th>Default reference range</th><th></th></tr>'+db.catalog[s].map((c,i)=>"<tr>"+["name","unit","ref"].map(f=>'<td><input data-cs="'+esc(s)+'" data-ci="'+i+'" data-cf="'+f+'" value="'+esc(c[f])+'" aria-label="'+f+'"></td>').join("")+'<td><button class="btn alt" style="margin:0" data-act="delTest" data-s="'+esc(s)+'" data-ci="'+i+'">Delete</button></td></tr>').join("")+"</table></div>").join("")+'<button class="btn" data-act="saveCat">Save changes</button><p class="muted">Changes apply to new orders. Existing orders keep the tests they were created with.</p>';
}
function collectCat(){document.querySelectorAll("[data-cs]").forEach(e=>{const c=db.catalog[e.dataset.cs][+e.dataset.ci];if(!c)return;const v=e.value.trim().replace(/\|/g,"-");if(e.dataset.cf==="name"){if(v)c.name=v}else c[e.dataset.cf]=v})}
function vOrders(){return "<h1>Orders &amp; Results</h1>"+ordersTable(db.orders.slice().reverse())}
function vDetail(){
 const o=db.orders.find(x=>x.id===ui.oid);if(!o)return vOrders();const p=pat(o.pid);
 return '<h1>'+esc(o.labNo)+" "+chip(o)+'</h1><div class="card"><div class="grid"><div><b>'+esc(p.name)+'</b><br><span class="muted">'+esc(p.age)+" / "+esc(p.sex)+" \u2022 "+esc(p.phone)+'</span></div><div><span class="muted">Clinician</span><br>'+esc(o.clinician||"-")+'</div><div><span class="muted">Specimen(s)</span><br>'+esc(o.specimen||"-")+'</div><div><span class="muted">Billing</span><br>'+money(o.amount)+" charged, "+money(o.paid)+' paid</div></div></div><h2>Enter results</h2><div class="wrap"><table><tr><th>Test</th><th>Result</th><th>Unit</th><th>Reference range</th><th>Remarks</th></tr>'+
 o.tests.map((t,i)=>(isCul(t)||isSem(t))?"<tr><td>"+esc(t.name)+'<br><small class="muted">'+esc(t.sec)+'</small></td><td colspan="4" class="muted">Fill in the report form below</td></tr>':"<tr><td>"+esc(t.name)+'<br><small class="muted">'+esc(t.sec)+"</small></td>"+["result","unit","ref","remarks"].map(f=>'<td><input data-i="'+i+'" data-f="'+f+'" value="'+esc(t[f])+'" aria-label="'+f+" for "+esc(t.name)+'"></td>').join("")+"</tr>").join("")+
 '</table></div>'+o.tests.map((t,i)=>isCul(t)?cultureForm(t,i):isSem(t)?semForm(t,i):"").join("")+'<div style="max-width:240px;margin-top:12px"><label for="dpaid">Amount paid (\u20A6)</label><input id="dpaid" type="number" min="0" value="'+(+o.paid||0)+'"></div><button class="btn" data-act="saveRes">Save results</button><button class="btn" data-act="complete">Mark completed</button><button class="btn" data-act="print">Print report</button><button class="btn alt" data-nav="orders">Back</button>';
}

 '<table style="width:100%;border-collapse:collapse;font-size:13px"><tr><td '+c+"><b>Patient:</b> "+esc(p.name)+"</td><td "+c+"><b>Lab No.:</b> "+esc(o.labNo)+"</td></tr><tr><td "+c+"><b>Age / Sex:</b> "+esc(p.age)+" / "+esc(p.sex)+"</td><td "+c+"><b>Date:</b> "+esc(o.date)+"</td></tr><tr><td "+c+"><b>Address / Phone:</b> "+esc(p.address)+" / "+esc(p.phone)+"</td><td "+c+"><b>Referring clinician:</b> "+esc(o.clinician)+"</td></tr><tr><td "+c+"><b>Specimen(s):</b> "+esc(o.specimen)+"</td><td "+c+"></td></tr></table>"+
 '<table style="width:100%;border-collapse:collapse;font-size:13px;margin-top:14px"><tr><th '+c+">Laboratory Test</th><th "+c+">Result</th><th "+c+">Unit</th><th "+c+">Reference Range</th><th "+c+">Remarks</th></tr>"+
 o.tests.filter(t=>!isCul(t)&&!isSem(t)).map(t=>"<tr><td "+c+">"+esc(t.name)+"</td><td "+c+">"+esc(t.result)+"</td><td "+c+">"+esc(t.unit)+"</td><td "+c+">"+esc(t.ref)+"</td><td "+c+">"+esc(t.remarks)+"</td></tr>").join("")+"</table>"+
 o.tests.map(t=>isCul(t)?cultureReport(t,c):isSem(t)?semReport(t,c):"").join("")+'<div style="display:flex;gap:16px;margin-top:28px;font-size:12px">'+["Performed by","Reviewed by","Authorized Signatory"].map(s=>'<div style="flex:1;border-top:1px solid #000;padding-top:4px"><b>'+s+"</b><br>Name / Signature / Date</div>").join("")+"</div></div>";

window.addEventListener("hashchange",()=>location.reload());
const pnorm=x=>String(x||"").trim().toLowerCase().replace(/\s+/g," ");
function pmatch(q){const n=pnorm(q),ph=n.replace(/[\s-]/g,"");if(!n)return[];return db.patients.filter(p=>(ph&&String(p.phone||"").replace(/[\s-]/g,"")===ph)||pnorm(p.name)===n)}
function pAllowed(o){return o&&o.status==="completed"&&pmatch(ui.pq).some(p=>p.id===o.pid)}
function vPortal(){
 const hd='<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h1>Patient Results</h1><button class="btn alt" data-pa="home">Home</button></div>';
 const form='<div class="card"><p>Enter your full name or phone number to view your completed results.</p><div style="max-width:360px"><label for="pq">Full name or phone number</label><input id="pq" autocomplete="off" value="'+esc(ui.pq||"")+'"></div><br><button class="btn" data-pa="go">View my results</button></div>';
 if(ui.view==="detail"){const o=db.orders.find(x=>x.id===ui.oid);if(pAllowed(o))return '<div class="card"><button class="btn" data-pa="back">Back to my results</button> <button class="btn" data-pa="print">Print result</button></div>'+report();ui.view="portal"}
 if(!pnorm(ui.pq))return hd+form;
 const ps=pmatch(ui.pq);
 if(!ps.length)return hd+form+'<div class="card"><b>No record found.</b> Check the spelling of your full name or your phone number, or contact the laboratory front desk.</div>';
 return hd+form+ps.map(p=>{const os=db.orders.filter(o=>o.pid===p.id&&o.status==="completed").slice().reverse();
  return '<div class="card"><h2>'+esc(p.name)+"</h2>"+(os.length?'<div class="wrap"><table><tr><th>Date</th><th>Lab No.</th><th>Tests</th><th></th></tr>'+os.map(o=>"<tr><td>"+esc(o.date)+"</td><td>"+esc(o.labNo)+"</td><td>"+o.tests.map(t=>esc(t.name)).join(", ")+'</td><td><button class="btn" data-pa="view" data-oid="'+esc(o.id)+'">View / Print</button></td></tr>').join("")+"</table></div>":"<p>No completed results yet. Please check again later.</p>")+"</div>"}).join("");
}
function renderPM(){
 $("#nav").style.display="none";
 $("#main").innerHTML=BANNER+vPortal();$("#rep").innerHTML=report();
 const q=$("#pq");if(q)q.addEventListener("keydown",e=>{if(e.key==="Enter"){ui.pq=q.value;ui.oid=null;ui.view="portal";render()}});
}
document.addEventListener("click",e=>{if(!PM)return;const t=e.target.closest("[data-pa]");if(!t)return;const a=t.dataset.pa;
 if(a==="go"){ui.pq=($("#pq")||{}).value||"";ui.oid=null;ui.view="portal";render()}
 else if(a==="view"){const o=db.orders.find(x=>String(x.id)===t.dataset.oid);if(pAllowed(o)){ui.oid=o.id;ui.view="detail";render();scrollTo(0,0)}}
 else if(a==="home"){history.replaceState(null,"",location.pathname+location.search);PM=false;ui.role=null;ui.view="dash";ui.oid=null;ui.pq="";render()}
 else if(a==="back"){ui.oid=null;ui.view="portal";render()}
 else if(a==="print")window.print()});
function lgin(){const v=($("#lp")||{}).value||"";if(!db.pin){if(v.length<4){alert("Use at least 4 characters.");return}db.pin=v;save()}else if(v!==db.pin){alert("Wrong PIN.");return}ui.role="admin";ui.admin=true;ui.view="dash";render()}
function renderLanding(){
 $("#nav").style.display="none";$("#rep").innerHTML="";
 $("#main").innerHTML=BANNER+'<div class="grid" style="max-width:820px;margin:auto"><div class="card"><h2 style="margin-top:0">Admin / Staff</h2><p>Manage patients, test orders, results and the test catalog.</p><div style="max-width:260px"><label for="lp">'+(db.pin?"Admin PIN":"Create an admin PIN (at least 4 characters)")+'</label><input id="lp" type="password" autocomplete="off"></div><br><button class="btn" data-lg="admin">'+(db.pin?"Login":"Set PIN and login")+'</button></div><div class="card"><h2 style="margin-top:0">Patient Results</h2><p>View and print your completed laboratory results using your full name or phone number.</p><button class="btn" data-lg="patient">Patient Results</button></div></div>';
 const q=$("#lp");if(q)q.addEventListener("keydown",e=>{if(e.key==="Enter")lgin()});
}
document.addEventListener("click",e=>{const t=e.target.closest("[data-lg]");if(!t)return;const a=t.dataset.lg;
 if(a==="admin")lgin();
 else if(a==="patient"){PM=true;ui.role="patient";ui.view="portal";ui.pq="";ui.oid=null;render()}
 else if(a==="logout"){ui.role=null;ui.admin=false;ui.view="dash";ui.oid=null;render()}});
function render(){if(PM)return renderPM();if(ui.role!=="admin")return renderLanding();$("#nav").style.display="";
 $("#nav").innerHTML='<div class="logo">'+LOGO+"<span>Gaskiya<br>LIMS</span></div>"+NAV.map(n=>'<button data-nav="'+n[0]+'" class="'+(ui.view===n[0]||(ui.view==="detail"&&n[0]==="orders")?"on":"")+'">'+n[1]+"</button>").join("")+'<button data-lg="logout">Logout</button>';
 const v={dash:vDash,patients:vPatients,new:vNew,orders:vOrders,detail:vDetail,admin:vAdmin}[ui.view];
 $("#main").innerHTML=BANNER+v();$("#rep").innerHTML=report();
}
const isCul=t=>/culture/i.test(t.name||"");
const isSem=t=>/semen|seminal/i.test(t.name||"");
const ABX=["Ampicillin","Ampiclox","Chloramphenicol","Erythromycin","Cotrimoxazole","Ciproxin","Pefloxacin","Augmentin","Ofloxacin","Tetracyclin","Nalidixic Acid","Nitrofurantoin","Colistin","Streptomycin","Penicillin","Gentamycin","Drovid"];
const SIR={S:"Sensitive",I:"Intermediate",R:"Resistant"};
const sirSel=(att,v)=>'<select '+att+'><option value=""></option>'+["S","I","R"].map(x=>'<option value="'+x+'"'+(v===x?" selected":"")+">"+x+"</option>").join("")+"</select>";
const nl=v=>esc(v).replace(/\n/g,"<br>");
const sg=(s,a,j)=>s[a+"|"+j]!==undefined?s[a+"|"+j]:(j===1?s[a]:"");
function cultureForm(t,i){
 const u=t.cul||{},s=u.sens||{},k='data-ci="'+i+'" ';
 const f=(n,l,p)=>'<div><label>'+l+'</label><input '+k+'data-cf="'+n+'" value="'+esc(u[n])+'" placeholder="'+(p||"")+'"></div>';
 const gr='<div><label>Growth</label><select '+k+'data-cf="gr">'+["","No growth","Growth"].map(x=>"<option"+(u.gr===x?" selected":"")+">"+x+"</option>").join("")+"</select></div>";
 const rows=ABX.map(a=>"<tr><td>"+esc(a)+"</td>"+[1,2,3].map(j=>"<td>"+sirSel(k+'data-ca="'+esc(a)+"|"+j+'"',sg(s,a,j))+"</td>").join("")+"</tr>").join("")+[1,2].map(n=>"<tr><td><input "+k+'data-cf="xa'+n+'" value="'+esc(u["xa"+n])+'" placeholder="Other antibiotic"></td>'+[1,2,3].map(j=>"<td>"+sirSel(k+'data-cf="xr'+n+"_"+j+'"',u["xr"+n+"_"+j])+"</td>").join("")+"</tr>").join("");
 return '<div class="card"><h2>Culture report: '+esc(t.name)+'</h2><div class="grid">'+f("src","Specimen / source","e.g. Urine, HVS")+f("gram","Gram stain")+gr+f("cnt","Colony count","e.g. 10^5 cfu/ml")+f("org","Organism isolated (1)")+f("org2","Organism isolated (2)")+f("org3","Organism isolated (3)")+'</div><label>Culture (description of growth)</label><textarea '+k+'data-cf="cl" rows="6" style="width:100%;font:inherit;padding:8px">'+esc(u.cl)+'</textarea><div class="grid"><div>'+f("cm","Comments")+'</div></div><h2>Antibiogram</h2><div class="wrap"><table><tr><th>Antibiotic</th><th>1</th><th>2</th><th>3</th></tr>'+rows+'</table></div><small class="muted">S = Sensitive, I = Intermediate, R = Resistant. Columns 1, 2 and 3 are the isolates. Leave blank any antibiotic not tested.</small></div>';
}
function cultureReport(t,c){
 const u=t.cul||{},s=u.sens||{},L=[];
 ABX.forEach(a=>{const r=[1,2,3].map(j=>sg(s,a,j)||"");if(r.some(x=>x))L.push([a,r])});
 [1,2].forEach(n=>{if(u["xa"+n]){const r=[1,2,3].map(j=>u["xr"+n+"_"+j]||"");if(r.some(x=>x))L.push([u["xa"+n],r])}});
 const cols=[1,2,3].filter(j=>L.some(x=>x[1][j-1]));
 const cell=(l,v)=>"<td "+c+"><b>"+l+":</b> "+esc(v||"-")+"</td>";
 return '<h3 style="color:#0E4D3A;margin:18px 0 6px">'+esc(t.name).toUpperCase()+' REPORT</h3><table style="width:100%;border-collapse:collapse;font-size:13px"><tr>'+cell("Specimen / source",u.src)+cell("Gram stain",u.gram)+"</tr><tr>"+cell("Growth",u.gr)+cell("Colony count",u.cnt)+"</tr><tr>"+cell("Organism (1)",u.org)+cell("Organism (2)",u.org2)+"</tr><tr>"+cell("Organism (3)",u.org3)+cell("Comments",u.cm)+"</tr></table>"+(u.cl?'<div style="margin-top:10px;font-size:13px"><b>Culture:</b><br>'+nl(u.cl)+"</div>":"")+(L.length?'<h3 style="color:#0E4D3A;margin:14px 0 6px">ANTIBIOGRAM</h3><table style="width:100%;border-collapse:collapse;font-size:13px"><tr><th '+c+">Antibiotic</th>"+cols.map(j=>"<th "+c+">"+j+"</th>").join("")+"</tr>"+L.map(x=>"<tr><td "+c+">"+esc(x[0])+"</td>"+cols.map(j=>"<td "+c+' style="text-align:center">'+esc(x[1][j-1]||"")+"</td>").join("")+"</tr>").join("")+'</table><div style="font-size:11px;margin-top:4px">S = Sensitive, I = Intermediate, R = Resistant</div>':"");
}
const SEMF=[["tp","Time produced"],["tr","Time received"],["te","Time examined"],["mp","Method of production"],["co","Colour"],["od","Odour"],["vo","Volume"],["lq","Liquefaction"],["vi","Viscosity"],["ph","pH"],["pr","Protein"],["gl","Glucose"],["ma","Motility: Active (%)"],["ms","Motility: Sluggish (%)"],["md","Motility: Dead (%)"],["tc","Total count"]];
function semForm(t,i){
 const u=t.cul||{},k='data-ci="'+i+'" ';
 return '<div class="card"><h2>Seminalysis report</h2><div class="grid">'+SEMF.map(f=>'<div><label>'+f[1]+'</label><input '+k+'data-cf="'+f[0]+'" value="'+esc(u[f[0]])+'"></div>').join("")+'</div><label>Morphology</label><textarea '+k+'data-cf="mo" rows="4" style="width:100%;font:inherit;padding:8px">'+esc(u.mo)+'</textarea></div>';
}
function semReport(t,c){
 const u=t.cul||{},cell=f=>"<td "+c+"><b>"+f[1]+":</b> "+esc(u[f[0]]||"-")+"</td>";
 let r="";for(let n=0;n<SEMF.length;n+=2)r+="<tr>"+cell(SEMF[n])+(SEMF[n+1]?cell(SEMF[n+1]):"<td "+c+"></td>")+"</tr>";
 return '<h3 style="color:#0E4D3A;margin:18px 0 6px">SEMINALYSIS REPORT</h3><table style="width:100%;border-collapse:collapse;font-size:13px">'+r+"</table>"+'<div style="margin-top:10px;font-size:13px"><b>Morphology:</b><br>'+nl(u.mo||"-")+"</div>";
}
function collect(){
 const o=db.orders.find(x=>x.id===ui.oid);if(!o)return null;
 document.querySelectorAll("[data-i]").forEach(e=>{o.tests[+e.dataset.i][e.dataset.f]=e.value});
 document.querySelectorAll("[data-cf]").forEach(e=>{const t=o.tests[+e.dataset.ci];t.cul=t.cul||{};t.cul[e.dataset.cf]=e.value});
 document.querySelectorAll("[data-ca]").forEach(e=>{const t=o.tests[+e.dataset.ci];t.cul=t.cul||{};t.cul.sens=t.cul.sens||{};t.cul.sens[e.dataset.ca]=e.value});
 o.paid=+val("dpaid")||0;return o;
}
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-nav],[data-open],[data-act]");if(!t)return;
 if(t.dataset.nav){ui.view=t.dataset.nav;render();return}
 if(t.dataset.open){ui.oid=t.dataset.open;ui.view="detail";render();return}
 const a=t.dataset.act;
 if(a==="addPatient"){
  if(!val("pn")){alert("Please enter the patient\u2019s name.");return}
  db.patients.push({id:"P"+Date.now(),name:val("pn"),age:val("pa"),sex:val("ps"),phone:val("pp"),address:val("pd")});save();render();
 }
 if(a==="saveOrder"){
  const ks=[...document.querySelectorAll(".tk:checked")].map(x=>x.value.split("|"));
  if(!ks.length){alert("Tick at least one test.");return}
  const id="O"+Date.now();
  db.orders.push({id,labNo:"GM-"+today().replace(/-/g,"")+"-"+String(++db.seq).padStart(3,"0"),pid:val("op"),clinician:val("oc"),specimen:val("osp"),date:today(),amount:+val("oa")||0,paid:+val("opd")||0,status:"pending",tests:ks.map(k=>{const c=(db.catalog[k[0]]||[]).find(x=>x.name===k[1])||{};return{sec:k[0],name:k[1],result:"",unit:c.unit||"",ref:c.ref||"",remarks:""}})});
  save();ui.oid=id;ui.view="detail";render();
 }
 if(a==="setPin"){if(val("ap").length<4){alert("Use at least 4 characters.");return}db.pin=val("ap");ui.admin=true;save();render()}
 if(a==="unlock"){if(val("ap")===db.pin){ui.admin=true;render()}else alert("Wrong PIN.")}
 if(a==="lock"){ui.admin=false;render()}
 if(a==="addTest"){
  const s=(val("ns")||val("sel")).replace(/\|/g,"-"),n=val("nt").replace(/\|/g,"-");
  if(!s||!n){alert("Enter a section and a test name.");return}
  collectCat();db.catalog[s]=db.catalog[s]||[];
  if(db.catalog[s].some(x=>x.name.toLowerCase()===n.toLowerCase())){alert("That test already exists in this section.");return}
  db.catalog[s].push({name:n,unit:val("nu"),ref:val("nr")});save();render();
 }
 if(a==="saveCat"){collectCat();save();render()}
 if(a==="delTest"){if(confirm("Delete this test from the catalog?")){collectCat();db.catalog[t.dataset.s].splice(+t.dataset.ci,1);save();render()}}
 if(a==="saveRes"){collect();save();render()}
 if(a==="complete"){const o=collect();if(o){o.status="completed";save();render()}}
 if(a==="print"){collect();save();render();window.print()}
});
document.addEventListener("input",e=>{
 if(e.target.id==="q"){const q=e.target.value.toLowerCase();document.querySelectorAll("#pt tr").forEach((r,i)=>{if(i)r.style.display=r.textContent.toLowerCase().includes(q)?"":"none"})}
});
render();
</script>
</body>
</html>
